name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rebuild v2.1 source archive
        run: cat source/v21/*.txt | base64 -d > /tmp/smart_budget_v21.zip
      - name: Verify v2.1 source archive
        run: |
          echo "1e444f0442c29bfa1cd7fd70c2a8ea37c93945facfa48a781c83289166f08ae2  /tmp/smart_budget_v21.zip" | sha256sum -c -
          unzip -t /tmp/smart_budget_v21.zip
      - name: Unpack v2.1 source
        run: unzip -q /tmp/smart_budget_v21.zip
      - name: Create Android host
        working-directory: smart_budget_flutter
        run: bash ./tool/bootstrap_android.sh
      - name: Resolve dependencies
        working-directory: smart_budget_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: smart_budget_flutter
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: smart_budget_flutter
        run: flutter test
      - name: Build ARM64 release APK
        working-directory: smart_budget_flutter
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-ledger-v2.1-arm64-release
          path: smart_budget_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
