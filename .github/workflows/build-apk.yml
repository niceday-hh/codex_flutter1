name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Rebuild source archive
        run: cat source/chunks/*.txt | base64 -d > /tmp/smart_budget_ci.zip
      - name: Verify source archive
        run: unzip -t /tmp/smart_budget_ci.zip
      - name: Unpack source
        run: unzip -q /tmp/smart_budget_ci.zip
      - name: Apply Flutter compatibility fixes
        working-directory: smart_budget_flutter
        run: |
          sed -i "/package:flutter\/foundation.dart/a import 'package:flutter/widgets.dart';" lib/app_store.dart
          sed -i 's/Icons.add_rounded_circled_solid/Icons.add_circle_rounded/g' lib/shell.dart
      - name: Create Android host
        working-directory: smart_budget_flutter
        run: bash ./tool/bootstrap_android.sh
      - name: Resolve dependencies
        working-directory: smart_budget_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: smart_budget_flutter
        run: flutter analyze
      - name: Test
        working-directory: smart_budget_flutter
        run: flutter test
      - name: Build ARM64 release APK
        working-directory: smart_budget_flutter
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-budget-arm64-release
          path: smart_budget_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
