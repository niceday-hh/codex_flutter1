workflows:
  android-apk:
    name: Smart Budget Android APK
    max_build_duration: 30
    environment:
      flutter: 3.47.2
      java: 21
    scripts:
      - name: Prepare Android host
        script: ./tool/bootstrap_android.sh
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build ARM64 APK
        script: flutter build apk --release --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
